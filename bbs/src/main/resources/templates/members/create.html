<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>회원가입 | Spring 게시판</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-800">
<main class="mx-auto max-w-xl px-5 py-12 sm:py-16">
    <section class="rounded-2xl bg-white p-7 shadow-lg shadow-slate-200/70 sm:p-10">
        <a th:href="@{/articles}" class="text-sm font-semibold tracking-wide text-indigo-600">SPRING BOARD</a>
        <h1 class="mt-5 text-3xl font-bold tracking-tight">회원가입</h1>
        <p class="mt-2 text-sm text-slate-500">계정을 만들고 게시글을 작성해 보세요.</p>

        <form th:action="@{/members}" th:object="${memberForm}" method="post" class="mt-8 space-y-5">
            <div th:if="${#fields.hasGlobalErrors()}" class="rounded-lg bg-rose-50 px-4 py-3 text-sm text-rose-700">
                <p th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p>
            </div>
            <div>
                <label for="username" class="mb-2 block text-sm font-medium">로그인 아이디</label>
                <input id="username" th:field="*{username}" autocomplete="username" required
                       class="w-full rounded-lg border border-slate-300 px-3 py-2.5 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100">
                <p th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="mt-1 text-sm text-rose-600"></p>
            </div>
            <div>
                <label for="password" class="mb-2 block text-sm font-medium">비밀번호</label>
                <input id="password" th:field="*{password}" type="password" autocomplete="new-password" required
                       class="w-full rounded-lg border border-slate-300 px-3 py-2.5 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100">
                <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="mt-1 text-sm text-rose-600"></p>
            </div>
            <div>
                <label for="passwordConfirm" class="mb-2 block text-sm font-medium">비밀번호 확인</label>
                <input id="passwordConfirm" th:field="*{passwordConfirm}" type="password" autocomplete="new-password" required
                       class="w-full rounded-lg border border-slate-300 px-3 py-2.5 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100">
                <p th:if="${#fields.hasErrors('passwordConfirm')}" th:errors="*{passwordConfirm}" class="mt-1 text-sm text-rose-600"></p>
                <p th:if="${#fields.hasErrors('passwordConfirmed')}" th:errors="*{passwordConfirmed}" class="mt-1 text-sm text-rose-600"></p>
            </div>
            <div>
                <label for="name" class="mb-2 block text-sm font-medium">이름</label>
                <input id="name" th:field="*{name}" autocomplete="name" required
                       class="w-full rounded-lg border border-slate-300 px-3 py-2.5 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100">
                <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="mt-1 text-sm text-rose-600"></p>
            </div>
            <div>
                <label for="email" class="mb-2 block text-sm font-medium">이메일</label>
                <input id="email" th:field="*{email}" type="email" autocomplete="email" required
                       class="w-full rounded-lg border border-slate-300 px-3 py-2.5 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100">
                <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="mt-1 text-sm text-rose-600"></p>
            </div>
            <button type="submit" class="w-full rounded-lg bg-indigo-600 px-4 py-3 font-semibold text-white transition hover:bg-indigo-700">가입하기</button>
        </form>
        <p class="mt-6 text-center text-sm text-slate-500">
            이미 계정이 있으신가요? <a th:href="@{/login}" class="font-semibold text-indigo-600 hover:text-indigo-700">로그인</a>
        </p>
    </section>
</main>
</body>
</html>
