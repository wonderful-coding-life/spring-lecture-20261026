<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>게시판 | Spring 게시판</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-800">
<header class="border-b border-slate-200 bg-white">
    <nav class="mx-auto flex max-w-6xl items-center justify-between px-5 py-4">
        <a th:href="@{/articles}" class="text-lg font-bold tracking-tight text-indigo-700">SPRING BOARD</a>
        <div class="flex items-center gap-3 text-sm">
            <a th:href="@{/login}" sec:authorize="isAnonymous()" class="font-medium text-slate-600 hover:text-indigo-600">로그인</a>
            <a th:href="@{/members/new}" sec:authorize="isAnonymous()" class="rounded-lg bg-indigo-600 px-3 py-2 font-semibold text-white hover:bg-indigo-700">회원가입</a>
            <span sec:authorize="isAuthenticated()" class="hidden text-slate-600 sm:inline"><span sec:authentication="name"></span>님</span>
            <a th:href="@{/articles/new}" sec:authorize="isAuthenticated()" class="rounded-lg bg-indigo-600 px-3 py-2 font-semibold text-white hover:bg-indigo-700">글쓰기</a>
            <form th:action="@{/logout}" method="post" sec:authorize="isAuthenticated()">
                <button type="submit" class="rounded-lg border border-slate-300 px-3 py-2 font-medium hover:bg-slate-50">로그아웃</button>
            </form>
        </div>
    </nav>
</header>
<main class="mx-auto max-w-6xl px-5 py-10 sm:py-14">
    <div class="mb-7 flex flex-col justify-between gap-4 sm:flex-row sm:items-end">
        <div>
            <p class="text-sm font-semibold uppercase tracking-widest text-indigo-600">Community</p>
            <h1 class="mt-2 text-3xl font-bold tracking-tight">게시판</h1>
            <p class="mt-2 text-slate-500">새로운 이야기와 정보를 나눠 보세요.</p>
        </div>
        <a th:href="@{/articles/new}" sec:authorize="isAuthenticated()" class="inline-flex items-center justify-center rounded-lg bg-indigo-600 px-4 py-2.5 font-semibold text-white hover:bg-indigo-700">새 글 작성</a>
    </div>

    <section class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">
        <div th:if="${articlePage.empty}" class="px-6 py-20 text-center">
            <div class="mx-auto flex h-12 w-12 items-center justify-center rounded-full bg-slate-100 text-xl text-slate-500">✎</div>
            <p class="mt-4 font-semibold">등록된 게시글이 없습니다.</p>
            <p class="mt-1 text-sm text-slate-500">첫 게시글을 작성해 보세요.</p>
        </div>
        <div th:unless="${articlePage.empty}" class="overflow-x-auto">
            <table class="w-full min-w-[620px] text-left text-sm">
                <thead class="border-b border-slate-200 bg-slate-50 text-xs uppercase tracking-wide text-slate-500">
                <tr>
                    <th scope="col" class="w-20 px-6 py-4 font-semibold">번호</th>
                    <th scope="col" class="px-6 py-4 font-semibold">제목</th>
                    <th scope="col" class="w-40 px-6 py-4 font-semibold">작성자</th>
                    <th scope="col" class="w-44 px-6 py-4 font-semibold">작성일</th>
                </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                <tr th:each="article : ${articlePage.content}" class="transition hover:bg-slate-50">
                    <td class="px-6 py-4 text-slate-500" th:text="${article.id}"></td>
                    <td class="px-6 py-4"><a th:href="@{/articles/{id}(id=${article.id})}" th:text="${article.title}" class="font-semibold text-slate-800 hover:text-indigo-600"></a></td>
                    <td class="px-6 py-4 text-slate-600" th:text="${article.author.name}"></td>
                    <td class="px-6 py-4 text-slate-500" th:text="${#temporals.format(article.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>

    <nav th:if="${articlePage.totalPages > 1}" aria-label="게시글 페이지" class="mt-7 flex items-center justify-center gap-2">
        <a th:if="${articlePage.hasPrevious()}" th:href="@{/articles(page=${articlePage.number - 1})}" class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm font-medium hover:bg-slate-50">이전</a>
        <a th:each="pageNumber : ${#numbers.sequence(0, articlePage.totalPages - 1)}"
           th:href="@{/articles(page=${pageNumber})}" th:text="${pageNumber + 1}"
           th:classappend="${pageNumber == articlePage.number} ? ' bg-indigo-600 text-white border-indigo-600' : ' border-slate-300 bg-white text-slate-700 hover:bg-slate-50'"
           class="min-w-10 rounded-lg border px-3 py-2 text-center text-sm font-semibold"></a>
        <a th:if="${articlePage.hasNext()}" th:href="@{/articles(page=${articlePage.number + 1})}" class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm font-medium hover:bg-slate-50">다음</a>
    </nav>
</main>
</body>
</html>
