<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${isEdit} ? '게시글 수정 | Spring 게시판' : '글쓰기 | Spring 게시판'">글쓰기 | Spring 게시판</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-800">
<header class="border-b border-slate-200 bg-white">
    <nav class="mx-auto flex max-w-4xl items-center justify-between px-5 py-4">
        <a th:href="@{/articles}" class="text-lg font-bold tracking-tight text-indigo-700">SPRING BOARD</a>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="rounded-lg border border-slate-300 px-3 py-2 text-sm font-medium hover:bg-slate-50">로그아웃</button>
        </form>
    </nav>
</header>
<main class="mx-auto max-w-4xl px-5 py-10 sm:py-14">
    <section class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm sm:p-9">
        <p class="text-sm font-semibold uppercase tracking-widest text-indigo-600">Article</p>
        <h1 th:text="${isEdit} ? '게시글 수정' : '새 게시글'" class="mt-2 text-3xl font-bold tracking-tight"></h1>
        <form th:if="${!isEdit}" th:action="@{/articles}" th:object="${articleForm}" method="post" class="mt-8 space-y-6">
            <div>
                <label for="title" class="mb-2 block text-sm font-semibold">제목</label>
                <input id="title" th:field="*{title}" maxlength="100" required
                       class="w-full rounded-lg border border-slate-300 px-3 py-3 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100">
                <p th:if="${#fields.hasErrors('title')}" th:errors="*{title}" class="mt-1 text-sm text-rose-600"></p>
            </div>
            <div>
                <label for="content" class="mb-2 block text-sm font-semibold">내용</label>
                <textarea id="content" th:field="*{content}" rows="14" required
                          class="w-full resize-y rounded-lg border border-slate-300 px-3 py-3 leading-6 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100"></textarea>
                <p th:if="${#fields.hasErrors('content')}" th:errors="*{content}" class="mt-1 text-sm text-rose-600"></p>
            </div>
            <div class="flex justify-end gap-3">
                <a th:href="@{/articles}" class="rounded-lg border border-slate-300 px-4 py-2.5 text-sm font-semibold hover:bg-slate-50">취소</a>
                <button type="submit" class="rounded-lg bg-indigo-600 px-5 py-2.5 text-sm font-semibold text-white hover:bg-indigo-700">등록하기</button>
            </div>
        </form>
        <form th:if="${isEdit}" th:action="@{/articles/{id}/edit(id=${article.id})}" th:object="${articleForm}" method="post" class="mt-8 space-y-6">
            <div>
                <label for="title" class="mb-2 block text-sm font-semibold">제목</label>
                <input id="title" th:field="*{title}" maxlength="100" required
                       class="w-full rounded-lg border border-slate-300 px-3 py-3 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100">
                <p th:if="${#fields.hasErrors('title')}" th:errors="*{title}" class="mt-1 text-sm text-rose-600"></p>
            </div>
            <div>
                <label for="content" class="mb-2 block text-sm font-semibold">내용</label>
                <textarea id="content" th:field="*{content}" rows="14" required
                          class="w-full resize-y rounded-lg border border-slate-300 px-3 py-3 leading-6 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100"></textarea>
                <p th:if="${#fields.hasErrors('content')}" th:errors="*{content}" class="mt-1 text-sm text-rose-600"></p>
            </div>
            <div class="flex justify-end gap-3">
                <a th:href="@{/articles/{id}(id=${article.id})}" class="rounded-lg border border-slate-300 px-4 py-2.5 text-sm font-semibold hover:bg-slate-50">취소</a>
                <button type="submit" class="rounded-lg bg-indigo-600 px-5 py-2.5 text-sm font-semibold text-white hover:bg-indigo-700">수정 완료</button>
            </div>
        </form>
    </section>
</main>
</body>
</html>
