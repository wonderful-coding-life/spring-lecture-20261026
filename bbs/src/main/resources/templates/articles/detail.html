<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${article.title} + ' | Spring 게시판'">게시글 | Spring 게시판</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-800">
<header class="border-b border-slate-200 bg-white">
    <nav class="mx-auto flex max-w-4xl items-center justify-between px-5 py-4">
        <a th:href="@{/articles}" class="text-lg font-bold tracking-tight text-indigo-700">SPRING BOARD</a>
        <div class="flex items-center gap-3 text-sm">
            <a th:href="@{/login}" sec:authorize="isAnonymous()" class="font-medium text-slate-600 hover:text-indigo-600">로그인</a>
            <a th:href="@{/members/new}" sec:authorize="isAnonymous()" class="font-medium text-slate-600 hover:text-indigo-600">회원가입</a>
            <span sec:authorize="isAuthenticated()" class="hidden text-slate-600 sm:inline"><span sec:authentication="name"></span>님</span>
            <form th:action="@{/logout}" method="post" sec:authorize="isAuthenticated()">
                <button type="submit" class="rounded-lg border border-slate-300 px-3 py-2 font-medium hover:bg-slate-50">로그아웃</button>
            </form>
        </div>
    </nav>
</header>
<main class="mx-auto max-w-4xl px-5 py-10 sm:py-14">
    <article class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">
        <header class="border-b border-slate-200 px-6 py-7 sm:px-9 sm:py-9">
            <p class="text-sm font-medium text-indigo-600">게시글 <span th:text="${article.id}"></span></p>
            <h1 th:text="${article.title}" class="mt-3 break-words text-2xl font-bold tracking-tight sm:text-3xl"></h1>
            <div class="mt-5 flex flex-wrap gap-x-5 gap-y-2 text-sm text-slate-500">
                <span>작성자 <strong th:text="${article.author.name}" class="font-semibold text-slate-700"></strong></span>
                <span th:text="${#temporals.format(article.createdAt, 'yyyy-MM-dd HH:mm')}"></span>
            </div>
        </header>
        <div th:text="${article.content}" class="min-h-64 whitespace-pre-wrap break-words px-6 py-8 leading-7 text-slate-700 sm:px-9 sm:py-10"></div>
    </article>
    <div class="mt-6 flex flex-wrap items-center justify-between gap-3">
        <a th:href="@{/articles}" class="rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-sm font-semibold hover:bg-slate-50">목록으로</a>
        <div sec:authorize="isAuthenticated()" th:if="${#authentication.name == article.author.username}" class="flex gap-2">
            <a th:href="@{/articles/{id}/edit(id=${article.id})}" class="rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-sm font-semibold hover:bg-slate-50">수정</a>
            <form th:action="@{/articles/{id}/delete(id=${article.id})}" method="post" onsubmit="return confirm('게시글을 삭제하시겠습니까?');">
                <button type="submit" class="rounded-lg bg-rose-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-rose-700">삭제</button>
            </form>
        </div>
    </div>
</main>
</body>
</html>
