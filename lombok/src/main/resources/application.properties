spring.application.name=demo

# log level
#logging.level.root=trace
logging.level.com.example.demo=warn
logging.level.com.example.demo.LombokApplication=trace

# log output
logging.file.name=./log/app.log
logging.logback.rollingpolicy.file-name-pattern=./log/app.backup.%d{yyyy-MM-dd}.%i.gz
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=2GB
