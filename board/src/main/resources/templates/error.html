<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${status} + ' 오류 | Spring 게시판'">오류 | Spring 게시판</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="flex min-h-screen items-center justify-center bg-slate-100 px-4 text-slate-800">
<main class="w-full max-w-md rounded-2xl bg-white p-8 text-center shadow-sm ring-1 ring-slate-200">
    <p class="text-sm font-bold tracking-widest text-indigo-600">ERROR <span th:text="${status}"></span></p>
    <h1 class="mt-3 text-2xl font-bold">요청을 처리할 수 없습니다.</h1>
    <p th:text="${message}" class="mt-3 text-slate-600"></p>
    <a th:href="@{/articles}" class="mt-6 inline-flex rounded-lg bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-indigo-700">게시글 목록으로</a>
</main>
</body>
</html>
