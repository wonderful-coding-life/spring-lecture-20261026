<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${isEdit} ? '게시글 수정 | Spring 게시판' : '글쓰기 | Spring 게시판'">글쓰기 | Spring 게시판</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-800">
<header class="border-b border-slate-200 bg-white">
    <nav class="mx-auto flex max-w-5xl flex-wrap items-center justify-between gap-3 px-4 py-4">
        <a th:href="@{/articles}" class="text-lg font-bold text-indigo-700">Spring 게시판</a>
        <div class="flex items-center gap-4 text-sm">
            <span class="text-slate-600"><span sec:authentication="name"></span>님</span>
            <a th:href="@{/articles}" class="text-slate-600 hover:text-indigo-700">목록</a>
            <form th:action="@{/logout}" method="post"><button class="text-slate-600 hover:text-indigo-700">로그아웃</button></form>
        </div>
    </nav>
</header>
<main class="mx-auto max-w-3xl px-4 py-10">
    <section class="rounded-2xl bg-white p-6 shadow-sm ring-1 ring-slate-200 sm:p-8">
        <p class="text-sm font-semibold text-indigo-600">COMMUNITY</p>
        <h1 th:text="${isEdit} ? '게시글 수정' : '새 게시글'" class="mt-1 text-2xl font-bold"></h1>
        <form th:action="${isEdit} ? @{/articles/{id}/edit(id=${articleId})} : @{/articles}" th:object="${articleForm}" method="post" class="mt-6 space-y-5">
            <div>
                <label for="title" class="mb-1 block text-sm font-medium">제목</label>
                <input id="title" th:field="*{title}" maxlength="200" class="w-full rounded-lg border border-slate-300 px-3 py-2.5 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100">
                <p th:if="${#fields.hasErrors('title')}" th:errors="*{title}" class="mt-1 text-sm text-rose-600"></p>
            </div>
            <div>
                <label for="content" class="mb-1 block text-sm font-medium">내용</label>
                <textarea id="content" th:field="*{content}" rows="12" class="w-full resize-y rounded-lg border border-slate-300 px-3 py-2.5 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100"></textarea>
                <p th:if="${#fields.hasErrors('content')}" th:errors="*{content}" class="mt-1 text-sm text-rose-600"></p>
            </div>
            <div class="flex justify-end gap-2">
                <a th:href="${isEdit} ? @{/articles/{id}(id=${articleId})} : @{/articles}" class="rounded-lg border border-slate-300 px-4 py-2.5 text-sm font-semibold text-slate-700 hover:bg-slate-50">취소</a>
                <button type="submit" th:text="${isEdit} ? '수정 완료' : '등록하기'" class="rounded-lg bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-indigo-700"></button>
            </div>
        </form>
    </section>
</main>
</body>
</html>
