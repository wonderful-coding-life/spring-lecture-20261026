<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>게시글 목록 | Spring 게시판</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-800">
<header class="border-b border-slate-200 bg-white">
    <nav class="mx-auto flex max-w-5xl flex-wrap items-center justify-between gap-3 px-4 py-4">
        <a th:href="@{/articles}" class="text-lg font-bold text-indigo-700">Spring 게시판</a>
        <div class="flex items-center gap-4 text-sm">
            <th:block sec:authorize="isAnonymous()">
                <a th:href="@{/login}" class="text-slate-600 hover:text-indigo-700">로그인</a>
                <a th:href="@{/members/new}" class="text-slate-600 hover:text-indigo-700">회원가입</a>
            </th:block>
            <th:block sec:authorize="isAuthenticated()">
                <span class="text-slate-600"><span sec:authentication="name"></span>님</span>
                <a th:href="@{/articles/new}" class="font-medium text-indigo-700">글쓰기</a>
                <form th:action="@{/logout}" method="post"><button class="text-slate-600 hover:text-indigo-700">로그아웃</button></form>
            </th:block>
        </div>
    </nav>
</header>
<main class="mx-auto max-w-5xl px-4 py-10">
    <div class="mb-6 flex items-end justify-between gap-4">
        <div><p class="text-sm font-semibold text-indigo-600">COMMUNITY</p><h1 class="mt-1 text-3xl font-bold">게시글</h1></div>
        <a sec:authorize="isAuthenticated()" th:href="@{/articles/new}" class="rounded-lg bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-indigo-700">새 글 작성</a>
    </div>
    <section class="overflow-hidden rounded-2xl bg-white shadow-sm ring-1 ring-slate-200">
        <div th:if="${articlePage.empty}" class="px-6 py-16 text-center text-slate-500">등록된 게시글이 없습니다.</div>
        <div th:unless="${articlePage.empty}" class="overflow-x-auto">
            <table class="w-full min-w-[620px] text-left text-sm">
                <thead class="bg-slate-50 text-slate-500"><tr><th class="px-5 py-4 font-medium">번호</th><th class="px-5 py-4 font-medium">제목</th><th class="px-5 py-4 font-medium">작성자</th><th class="px-5 py-4 font-medium">작성일</th></tr></thead>
                <tbody class="divide-y divide-slate-100">
                    <tr th:each="article, row : ${articlePage.content}" class="hover:bg-slate-50">
                        <td class="px-5 py-4 text-slate-500" th:text="${articlePage.totalElements - (articlePage.number * articlePage.size) - row.index}"></td>
                        <td class="px-5 py-4"><a th:href="@{/articles/{id}(id=${article.id})}" th:text="${article.title}" class="font-semibold text-slate-800 hover:text-indigo-700"></a></td>
                        <td class="px-5 py-4 text-slate-600" th:text="${article.author.name}"></td>
                        <td class="px-5 py-4 text-slate-500" th:text="${#temporals.format(article.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>
    <nav th:if="${articlePage.totalPages > 1}" class="mt-6 flex items-center justify-center gap-2" aria-label="페이지 이동">
        <a th:if="${articlePage.hasPrevious()}" th:href="@{/articles(page=${articlePage.number - 1})}" class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm hover:bg-slate-50">이전</a>
        <a th:each="pageNumber : ${#numbers.sequence(0, articlePage.totalPages - 1)}" th:href="@{/articles(page=${pageNumber})}" th:text="${pageNumber + 1}" th:classappend="${pageNumber == articlePage.number} ? ' bg-indigo-600 text-white border-indigo-600' : ' bg-white text-slate-700 border-slate-300'" class="rounded-lg border px-3 py-2 text-sm"></a>
        <a th:if="${articlePage.hasNext()}" th:href="@{/articles(page=${articlePage.number + 1})}" class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm hover:bg-slate-50">다음</a>
    </nav>
</main>
</body>
</html>
