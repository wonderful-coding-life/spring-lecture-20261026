<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>로그인 | Spring 게시판</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-800">
<header class="border-b border-slate-200 bg-white">
    <nav class="mx-auto flex max-w-5xl items-center justify-between px-4 py-4">
        <a th:href="@{/articles}" class="text-lg font-bold text-indigo-700">Spring 게시판</a>
        <div class="flex items-center gap-4 text-sm">
            <a th:href="@{/login}" class="font-medium text-indigo-700">로그인</a>
            <a th:href="@{/members/new}" class="text-slate-600 hover:text-indigo-700">회원가입</a>
        </div>
    </nav>
</header>
<main class="mx-auto flex max-w-md justify-center px-4 py-16">
    <section class="w-full rounded-2xl bg-white p-8 shadow-sm ring-1 ring-slate-200">
        <h1 class="text-2xl font-bold">로그인</h1>
        <p class="mt-2 text-sm text-slate-500">게시판 이용을 위해 로그인해 주세요.</p>
        <div th:if="${param.error}" class="mt-5 rounded-lg bg-rose-50 px-4 py-3 text-sm text-rose-700">아이디 또는 비밀번호를 확인해 주세요.</div>
        <div th:if="${param.logout}" class="mt-5 rounded-lg bg-emerald-50 px-4 py-3 text-sm text-emerald-700">로그아웃되었습니다.</div>
        <form th:action="@{/login}" method="post" class="mt-6 space-y-5">
            <div>
                <label for="username" class="mb-1 block text-sm font-medium">로그인 아이디</label>
                <input id="username" name="username" type="text" autocomplete="username" required class="w-full rounded-lg border border-slate-300 px-3 py-2.5 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100">
            </div>
            <div>
                <label for="password" class="mb-1 block text-sm font-medium">비밀번호</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required class="w-full rounded-lg border border-slate-300 px-3 py-2.5 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100">
            </div>
            <button type="submit" class="w-full rounded-lg bg-indigo-600 px-4 py-2.5 font-semibold text-white hover:bg-indigo-700">로그인</button>
        </form>
        <p class="mt-6 text-center text-sm text-slate-500">아직 회원이 아니신가요? <a th:href="@{/members/new}" class="font-semibold text-indigo-700 hover:underline">회원가입</a></p>
    </section>
</main>
</body>
</html>
