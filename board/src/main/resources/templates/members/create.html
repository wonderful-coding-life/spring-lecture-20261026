<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>회원가입 | Spring 게시판</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-800">
<header class="border-b border-slate-200 bg-white">
    <nav class="mx-auto flex max-w-5xl items-center justify-between px-4 py-4">
        <a th:href="@{/articles}" class="text-lg font-bold text-indigo-700">Spring 게시판</a>
        <div class="flex items-center gap-4 text-sm">
            <a th:href="@{/login}" class="text-slate-600 hover:text-indigo-700">로그인</a>
            <a th:href="@{/members/new}" class="font-medium text-indigo-700">회원가입</a>
        </div>
    </nav>
</header>
<main class="mx-auto max-w-lg px-4 py-10">
    <section class="rounded-2xl bg-white p-6 shadow-sm ring-1 ring-slate-200 sm:p-8">
        <h1 class="text-2xl font-bold">회원가입</h1>
        <p class="mt-2 text-sm text-slate-500">계정을 만들고 게시판에 참여해 보세요.</p>
        <form th:action="@{/members}" th:object="${memberForm}" method="post" class="mt-6 space-y-4">
            <div>
                <label for="username" class="mb-1 block text-sm font-medium">로그인 아이디</label>
                <input id="username" th:field="*{username}" autocomplete="username" class="w-full rounded-lg border border-slate-300 px-3 py-2.5 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100">
                <p th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="mt-1 text-sm text-rose-600"></p>
            </div>
            <div>
                <label for="password" class="mb-1 block text-sm font-medium">비밀번호</label>
                <input id="password" th:field="*{password}" type="password" autocomplete="new-password" class="w-full rounded-lg border border-slate-300 px-3 py-2.5 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100">
                <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="mt-1 text-sm text-rose-600"></p>
            </div>
            <div>
                <label for="passwordConfirmation" class="mb-1 block text-sm font-medium">비밀번호 확인</label>
                <input id="passwordConfirmation" th:field="*{passwordConfirmation}" type="password" autocomplete="new-password" class="w-full rounded-lg border border-slate-300 px-3 py-2.5 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100">
                <p th:if="${#fields.hasErrors('passwordConfirmation')}" th:errors="*{passwordConfirmation}" class="mt-1 text-sm text-rose-600"></p>
            </div>
            <div>
                <label for="name" class="mb-1 block text-sm font-medium">이름</label>
                <input id="name" th:field="*{name}" autocomplete="name" class="w-full rounded-lg border border-slate-300 px-3 py-2.5 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100">
                <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="mt-1 text-sm text-rose-600"></p>
            </div>
            <div>
                <label for="email" class="mb-1 block text-sm font-medium">이메일</label>
                <input id="email" th:field="*{email}" type="email" autocomplete="email" class="w-full rounded-lg border border-slate-300 px-3 py-2.5 outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100">
                <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="mt-1 text-sm text-rose-600"></p>
            </div>
            <button type="submit" class="w-full rounded-lg bg-indigo-600 px-4 py-2.5 font-semibold text-white hover:bg-indigo-700">가입하기</button>
        </form>
    </section>
</main>
</body>
</html>
